<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Charon">
  <!-- Obsidian tile: identical to the dashboard's --ink-950 so the tab and
       the page read as one surface. -->
  <rect width="32" height="32" rx="7" fill="#030712"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- The obol: a struck coin, the ferryman's fare. -->
  <circle cx="16" cy="16" r="8.25" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="2"/>
  <!-- The pole: Charon's oar, crossing the coin at full diagonal so the shape
       still reads at 16px. -->
  <path d="M5.5 26.5 26.5 5.5" stroke="#38bdf8" stroke-width="2.1" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="2.1" fill="#38bdf8"/>
</svg>
